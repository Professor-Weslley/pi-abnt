# Gera o PDF do relatório a cada push e disponibiliza para download
# na aba "Actions" do repositório (seção "Artifacts").
name: Gerar PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fontes Microsoft (Times New Roman)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer fontconfig
          sudo fc-cache -f

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pacotes Python
        run: pip install -r requirements.txt

      - name: R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Pacotes R
        run: Rscript -e 'install.packages(c("reticulate", "knitr", "rmarkdown"))'

      - name: Quarto + TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Renderizar
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: quarto render relatorio_pi.qmd

      - name: Publicar PDF
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-pdf
          path: relatorio_pi.pdf
